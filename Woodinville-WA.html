const $ = id => document.getElementById(id);
const days = DATA.days;
const N = days.length;
const seasons = Object.fromEntries(DATA.seasons.map(s => [s.key, s]));
const COLOR = { cold: "var(--cold)", warm: "var(--warm)", wet: "var(--wet)", dry: "var(--dry)" };
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s, opts = { weekday: "short", month: "short", day: "numeric", year: "numeric" }) =>
  parseDate(s).toLocaleDateString("en-US", opts);
const fmtLen = m => `${Math.floor(Math.round(m) / 60)}h ${String(Math.round(m) % 60).padStart(2, "0")}m`;
const fmtClock = m => {
  let h = Math.floor(m / 60), mm = Math.round(m % 60);
  if (mm === 60) { h += 1; mm = 0; }
  const ap = h >= 12 && h < 24 ? "PM" : "AM";
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${String(mm).padStart(2, "0")} ${ap}`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ------------------------------------------------------------------ header & cards
const P = DATA.place;
$("h1").textContent = P ? `Seasons near ${P.label.split(",").slice(0, 2).join(",")}` : `Seasons at ${DATA.name}`;
$("sub").textContent =
  `Climate: ${DATA.name} (${DATA.station}, ${DATA.lat.toFixed(4)}, ${DATA.lon.toFixed(4)}, ${Math.round(DATA.elevation_m)} m), NOAA 1991–2020 daily normals · ` +
  `Sun: ${P ? `${P.lat.toFixed(4)}, ${P.lon.toFixed(4)}, ` : ""}${DATA.tz}, ${fmtDate(days[0].date)} – ${fmtDate(days[N - 1].date)}`;

function seasonValue(s) {
  if (s.unit === "°F") return `${s.mean.toFixed(1)}°F avg`;
  if (s.unit === "%") return `${s.mean.toFixed(0)}% chance of rain`;
  return `${(s.mean * 91).toFixed(2)} in total`;
}
$("seasonCards").innerHTML = ["cold", "warm", "wet", "dry"].filter(k => seasons[k]).map(k => {
  const s = seasons[k];
  return `<div class="card"><div class="k"><span class="swatch" style="background:${COLOR[k]}"></span>${esc(s.label)}</div>
    <div class="v">${esc(s.start)} – ${esc(s.end)}</div>
    <div class="n">Centered ${esc(s.center)} · ${seasonValue(s)} · ${esc(s.strength)}</div></div>`;
}).join("");

const X = DATA.extremes;
const sunCards = [
  ["earliest_sunrise", "Earliest sunrise", e => e.rise],
  ["latest_sunrise", "Latest sunrise", e => e.rise],
  ["earliest_sunset", "Earliest sunset", e => e.set],
  ["latest_sunset", "Latest sunset", e => e.set],
  ["longest_day", "Longest day", e => e.len],
  ["shortest_day", "Shortest day", e => e.len],
];
$("sunCards").innerHTML = sunCards.filter(([k]) => X[k]).map(([k, label, f]) =>
  `<div class="card"><div class="k">${label}</div><div class="v">${esc(f(X[k]))}</div><div class="n">${esc(X[k].date)}</div></div>`
).join("");

// ------------------------------------------------------------------ chart geometry
const W = 1120, ML = 70, MR = 28;
const PW = W - ML - MR;
const x = i => ML + (i + 0.5) * PW / N;
const layout = {};
let y0 = 8;
const block = (name, h, gapTop) => { y0 += gapTop; layout[name] = { top: y0, h }; y0 += h; };
block("strip", 62, 22);
block("temp", 200, 44);
block("rain", 140, 44);
block("sun", 230, 44);
const AXIS_Y = y0 + 8;
const H = AXIS_Y + 26;
const svg = $("chart");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

const ext = (arr, pad = 0) => { const v = arr.filter(a => a != null); return [Math.min(...v) - pad, Math.max(...v) + pad]; };
const scale = (dom, top, h) => v => top + h - (v - dom[0]) / (dom[1] - dom[0]) * h;
const niceTicks = (lo, hi, step) => { const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(v); return t; };

const parts = [];
const add = s => parts.push(s);

// month grid (behind everything)
const monthStarts = [];
days.forEach((d, i) => { if (d.date.endsWith("-01") || i === 0) monthStarts.push(i); });
const gridTop = layout.strip.top;
monthStarts.forEach(i => {
  if (days[i].date.endsWith("-01"))
    add(`<line x1="${x(i) - PW / N / 2}" x2="${x(i) - PW / N / 2}" y1="${gridTop}" y2="${AXIS_Y - 8}" stroke="var(--grid)" stroke-width="1"/>`);
});
monthStarts.forEach((i, k) => {
  const end = k + 1 < monthStarts.length ? monthStarts[k + 1] : N;
  if (end - i < 12) return;
  const d = parseDate(days[i].date);
  const lbl = d.toLocaleDateString("en-US", { month: "short" }) + (d.getMonth() === 0 || k === 0 ? ` ${d.getFullYear()}` : "");
  add(`<text x="${(x(i) + x(end - 1)) / 2}" y="${AXIS_Y + 10}" text-anchor="middle">${lbl}</text>`);
});

function shade(key, top, h) {
  const s = seasons[key]; if (!s) return;
  s.segments.forEach(([a, b]) => {
    add(`<rect x="${x(a) - PW / N / 2}" y="${top}" width="${(b - a + 1) * PW / N}" height="${h}" fill="${COLOR[key]}" fill-opacity="var(--shade-alpha)" style="fill-opacity:var(--shade-alpha)"/>`);
  });
}

function panelTitle(name, title, note) {
  const L = layout[name];
  add(`<text class="title" x="${ML - 62}" y="${L.top - 14}">${title}</text>`);
  if (note) add(`<text class="muted" x="${W - MR}" y="${L.top - 14}" text-anchor="end">${note}</text>`);
}

function yAxis(name, sc, ticks, fmt) {
  const L = layout[name];
  ticks.forEach(t => {
    const yy = sc(t);
    add(`<line x1="${ML}" x2="${W - MR}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>`);
    add(`<text x="${ML - 8}" y="${yy + 4}" text-anchor="end">${fmt(t)}</text>`);
  });
  add(`<line x1="${ML}" x2="${W - MR}" y1="${L.top + L.h}" y2="${L.top + L.h}" stroke="var(--axis)"/>`);
}

function pathFor(key, sc) {
  let d = "", pen = false;
  days.forEach((p, i) => {
    const v = p[key];
    if (v == null) { pen = false; return; }
    d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${sc(v).toFixed(1)}`; pen = true;
  });
  return d;
}
function areaBetween(lo, hi, sc) {
  const idx = days.map((_, i) => i).filter(i => days[i][lo] != null && days[i][hi] != null);
  if (!idx.length) return "";
  return "M" + idx.map(i => `${x(i).toFixed(1)},${sc(days[i][hi]).toFixed(1)}`).join("L") +
    "L" + idx.reverse().map(i => `${x(i).toFixed(1)},${sc(days[i][lo]).toFixed(1)}`).join("L") + "Z";
}

// ---- season strip
{
  const L = layout.strip;
  add(`<text class="title" x="${ML - 62}" y="${L.top - 10}">Seasons</text>`);
  const rows = [["Temp", ["cold", "warm"]], ["Precip", ["wet", "dry"]]];
  const rh = 24, gap = 10;
  rows.forEach(([lbl, keys], r) => {
    const top = L.top + r * (rh + gap);
    add(`<text x="${ML - 8}" y="${top + rh / 2 + 4}" text-anchor="end">${lbl}</text>`);
    keys.forEach(k => {
      const s = seasons[k]; if (!s) return;
      s.segments.forEach(([a, b]) => {
        const x1 = x(a) - PW / N / 2 + 1, w = (b - a + 1) * PW / N - 2;
        add(`<rect x="${x1}" y="${top}" width="${w}" height="${rh}" rx="4" fill="${COLOR[k]}"/>`);
        const text = `${s.label.replace(" season", "")} · ${s.start} – ${s.end}`;
        const short = s.label.replace(" season", "");
        const lbl = w > text.length * 6.6 + 16 ? text : (w > short.length * 6.6 + 12 ? short : "");
        if (lbl) {
          // label sits on a surface chip so text stays in text ink, not series color
          const tw = lbl.length * 5.75 + 13;
          add(`<rect x="${x1 + 5}" y="${top + 4}" width="${tw}" height="${rh - 8}" rx="3" fill="var(--surface-1)" fill-opacity="0.92"/>`);
          add(`<text class="strong" x="${x1 + 11}" y="${top + rh / 2 + 4}" style="font-size:11.5px">${lbl}</text>`);
        }
      });
    });
  });
}

// ---- temperature
const tDom = ext(days.flatMap(d => [d.tmin, d.tmax]), 4);
const tSc = scale(tDom, layout.temp.top, layout.temp.h);
{
  const L = layout.temp;
  panelTitle("temp", "Normal temperature", "line = daily average · band = normal low to high");
  shade("cold", L.top, L.h); shade("warm", L.top, L.h);
  yAxis("temp", tSc, niceTicks(tDom[0], tDom[1], 10), t => `${t}°`);
  add(`<path d="${areaBetween("tmin", "tmax", tSc)}" fill="var(--band)" fill-opacity="0.55"/>`);
  add(`<path d="${pathFor("tavg", tSc)}" fill="none" stroke="var(--ink-line)" stroke-width="2" stroke-linejoin="round"/>`);
}

// ---- rain
const rMax = Math.min(100, Math.ceil(Math.max(...days.map(d => d.pop ?? 0)) / 10) * 10 + 10);
const rSc = scale([0, rMax], layout.rain.top, layout.rain.h);
{
  const L = layout.rain;
  panelTitle("rain", "Chance of precipitation", "probability of ≥ 0.01 in on that day");
  shade("wet", L.top, L.h); shade("dry", L.top, L.h);
  yAxis("rain", rSc, niceTicks(0, rMax, rMax > 60 ? 20 : 10), t => `${t}%`);
  add(`<path d="${pathFor("pop", rSc)}" fill="none" stroke="var(--ink-line)" stroke-width="2" stroke-linejoin="round"/>`);
}

// ---- sun
const sDomRaw = ext(days.flatMap(d => [d.rise, d.set]));
const sDom = [Math.floor(sDomRaw[0] / 60 - 1.6) * 60, Math.ceil(sDomRaw[1] / 60 + 1.2) * 60];
const sSc = scale(sDom, layout.sun.top, layout.sun.h);
{
  const L = layout.sun;
  panelTitle("sun", "Sunrise & sunset (local clock time)", "shaded band = daylight · jumps are daylight saving time changes");
  const step = sDom[1] - sDom[0] > 14 * 60 ? 180 : 120;
  yAxis("sun", sSc, niceTicks(sDom[0], sDom[1], step), fmtClock);
  // band (split at gaps so polar days don't bridge)
  add(`<path d="${areaBetween("rise", "set", sSc)}" fill="var(--sun-fill)"/>`);
  // break lines at DST jumps so the step reads as a step
  const dstPath = key => {
    let d = "", prev = null;
    days.forEach((p, i) => {
      const v = p[key]; if (v == null) { prev = null; return; }
      const jump = prev != null && Math.abs(v - prev) > 30;
      d += `${prev == null || jump ? "M" : "L"}${x(i).toFixed(1)},${sSc(v).toFixed(1)}`; prev = v;
    });
    return d;
  };
  add(`<path d="${dstPath("rise")}" fill="none" stroke="var(--sun)" stroke-width="2"/>`);
  add(`<path d="${dstPath("set")}" fill="none" stroke="var(--sun)" stroke-width="2"/>`);
  const li = Math.round(N * 0.42);  // mid-window, away from the solstice/extreme labels
  add(`<text x="${x(li)}" y="${sSc(days[li].set) - 9}" class="muted" text-anchor="middle">Sunset</text>`);
  add(`<text x="${x(li)}" y="${sSc(days[li].rise) + 17}" class="muted" text-anchor="middle">Sunrise</text>`);

  // extreme markers
  const anchor = i => i < N * 0.08 ? "start" : i > N * 0.92 ? "end" : "middle";
  const mark = (key, field, label, below, inside) => {
    const e = X[key]; if (!e) return;
    const i = e.index, v = days[i][field], cx = x(i), cy = sSc(v);
    add(`<circle cx="${cx}" cy="${cy}" r="4.5" fill="var(--sun)" stroke="var(--surface-1)" stroke-width="2"/>`);
    const ty = below ? cy + 19 : cy - 10;
    add(`<text x="${cx}" y="${ty}" text-anchor="${anchor(i)}" style="font-size:11.5px" paint-order="stroke" stroke="${inside ? "var(--sun-fill)" : "var(--surface-1)"}" stroke-width="5" stroke-linejoin="round"><tspan class="strong">${label}</tspan> ${esc(field === "rise" ? e.rise : e.set).replace(/ [A-Z]{3,4}$/, "")}</text>`);
  };
    const dayMark = (key, label) => {
    const e = X[key]; if (!e) return;
    const i = e.index, cx = x(i), a = sSc(days[i].rise), b = sSc(days[i].set);
    add(`<line x1="${cx}" x2="${cx}" y1="${a}" y2="${b}" stroke="var(--sun)" stroke-width="1.5" stroke-dasharray="3 3"/>`);
    add(`<text x="${cx}" y="${(a + b) / 2 + 4}" text-anchor="${anchor(i)}" style="font-size:11.5px" paint-order="stroke" stroke="var(--sun-fill)" stroke-width="4"><tspan class="strong">${label}</tspan> ${esc(e.len)}</text>`);
  };
  dayMark("longest_day", "Longest day");
  dayMark("shortest_day", "Shortest day");
  mark("earliest_sunrise", "rise", "Earliest sunrise", true, false);
  // Labels for the winter extremes normally sit inside the daylight band; when the band is
  // too narrow to hold them plus the shortest-day label, move them outside it.
  const bandPx = key => X[key] ? sSc(days[X[key].index].rise) - sSc(days[X[key].index].set) : 999;
  const roomy = key => bandPx(key) > 80;
  mark("latest_sunrise", "rise", "Latest sunrise", !roomy("latest_sunrise"), roomy("latest_sunrise"));
  mark("earliest_sunset", "set", "Earliest sunset", roomy("earliest_sunset"), roomy("earliest_sunset"));
  mark("latest_sunset", "set", "Latest sunset", false, false);
}

// ---- hover layer
add(`<line id="cross" x1="0" x2="0" y1="${gridTop}" y2="${AXIS_Y - 8}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>`);
add(`<g id="dots" visibility="hidden">
  <circle id="dT" r="4.5" fill="var(--ink-line)" stroke="var(--surface-1)" stroke-width="2"/>
  <circle id="dR" r="4.5" fill="var(--ink-line)" stroke="var(--surface-1)" stroke-width="2"/>
  <circle id="dS1" r="4.5" fill="var(--sun)" stroke="var(--surface-1)" stroke-width="2"/>
  <circle id="dS2" r="4.5" fill="var(--sun)" stroke="var(--surface-1)" stroke-width="2"/></g>`);
add(`<rect id="hit" x="${ML}" y="${gridTop}" width="${PW}" height="${AXIS_Y - 8 - gridTop}" fill="transparent"/>`);

svg.insertAdjacentHTML("beforeend", parts.join("\n"));
$("chartDesc").textContent = `Seasonal chart for ${DATA.name}: season windows, normal temperature, chance of precipitation, and sunrise/sunset times for each day from ${days[0].date} to ${days[N - 1].date}.`;

const tip = $("tip"), panel = $("panel");
const setDot = (id, cx, cy) => { const c = $(id); if (cy == null || isNaN(cy)) { c.setAttribute("visibility", "hidden"); return; } c.setAttribute("visibility", "inherit"); c.setAttribute("cx", cx); c.setAttribute("cy", cy); };
function show(evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const i = Math.max(0, Math.min(N - 1, Math.floor((p.x - ML) / (PW / N))));
  const d = days[i], cx = x(i);
  $("cross").setAttribute("x1", cx); $("cross").setAttribute("x2", cx); $("cross").setAttribute("visibility", "visible");
  $("dots").setAttribute("visibility", "visible");
  setDot("dT", cx, d.tavg == null ? null : tSc(d.tavg));
  setDot("dR", cx, d.pop == null ? null : rSc(d.pop));
  setDot("dS1", cx, d.rise == null ? null : sSc(d.rise));
  setDot("dS2", cx, d.set == null ? null : sSc(d.set));
  const tags = ["cold", "warm", "wet", "dry"].filter(k => seasons[k] && seasons[k].segments.some(([a, b]) => i >= a && i <= b))
    .map(k => `<span class="tag"><span class="swatch" style="background:${COLOR[k]}"></span>${esc(seasons[k].label)}</span>`).join("");
  const row = (a, b) => b == null ? "" : `<div class="row"><span>${a}</span><span>${b}</span></div>`;
  tip.innerHTML = `<b>${fmtDate(d.date)}</b>` +
    row("Avg temp", d.tavg == null ? null : `${d.tavg.toFixed(1)}°F`) +
    row("Normal high / low", d.tmax == null ? null : `${Math.round(d.tmax)}° / ${Math.round(d.tmin)}°`) +
    row("Chance of precip", d.pop == null ? null : `${Math.round(d.pop)}%`) +
    row("Sunrise", d.riseLabel) + row("Sunset", d.setLabel) +
    row("Daylight", d.len == null ? null : fmtLen(d.len)) +
    (tags ? `<div class="tags">${tags}</div>` : "");
  tip.style.display = "block";
  const pr = panel.getBoundingClientRect();
  let left = evt.clientX - pr.left + 16;
  if (left + tip.offsetWidth > pr.width - 8) left = evt.clientX - pr.left - tip.offsetWidth - 16;
  let top = evt.clientY - pr.top - tip.offsetHeight / 2;
  top = Math.max(4, Math.min(pr.height - tip.offsetHeight - 4, top));
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hide() { tip.style.display = "none"; $("cross").setAttribute("visibility", "hidden"); $("dots").setAttribute("visibility", "hidden"); }
$("hit").addEventListener("pointermove", show);
$("hit").addEventListener("pointerleave", hide);

// ------------------------------------------------------------------ table
$("table").innerHTML = `<thead><tr><th>Date</th><th>Avg °F</th><th>High °F</th><th>Low °F</th><th>Precip chance</th><th>Sunrise</th><th>Sunset</th><th>Daylight</th><th style="text-align:left">Seasons</th></tr></thead><tbody>` +
  days.map((d, i) => {
    const tags = ["cold", "warm", "wet", "dry"].filter(k => seasons[k] && seasons[k].segments.some(([a, b]) => i >= a && i <= b)).map(k => seasons[k].label.replace(" season", "")).join(", ");
    const f = (v, n = 1) => v == null ? "–" : v.toFixed(n);
    return `<tr><td>${fmtDate(d.date)}</td><td>${f(d.tavg)}</td><td>${f(d.tmax)}</td><td>${f(d.tmin)}</td><td>${d.pop == null ? "–" : Math.round(d.pop) + "%"}</td><td>${d.riseLabel ?? "–"}</td><td>${d.setLabel ?? "–"}</td><td>${d.len == null ? "–" : fmtLen(d.len)}</td><td style="text-align:left">${tags}</td></tr>`;
  }).join("") + "</tbody>";

// ------------------------------------------------------------------ notes
const notes = [
  "Each season is the 91-day stretch (wrapping across New Year's) with the lowest or highest total of the daily normal: average temperature for cold/warm, chance of ≥ 0.01 in of precipitation for wet/dry.",
];
if (seasons.wet_amt && seasons.dry_amt) {
  notes.push(`By precipitation <em>amount</em> instead: wet ${esc(seasons.wet_amt.start)} – ${esc(seasons.wet_amt.end)} (${(seasons.wet_amt.mean * 91).toFixed(2)} in), dry ${esc(seasons.dry_amt.start)} – ${esc(seasons.dry_amt.end)} (${(seasons.dry_amt.mean * 91).toFixed(2)} in). NOAA spreads each month's normal evenly over its days, so amount-based windows tend to snap to month boundaries.`);
}
notes.push(`Sunrise and sunset use NOAA's solar algorithm (accurate to about a minute) for ${P ? "the requested location" : "the station's coordinates"}, shown in local clock time including daylight saving time. Day length is actual elapsed time.`);
$("notes").innerHTML = notes.map(n => `<p>${n}</p>`).join("");
</script>
</body>
</html>
